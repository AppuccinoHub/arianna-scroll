<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#ffe3ee" />
  <meta name="color-scheme" content="light" />
  <meta name="description" content="Scroll, tap, and learn Italian one card at a time. Ciao, bella!" />
  <title>Italian with Arianna 🇮🇹</title>

  <!-- Add to Home Screen (iPhone / Android) -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Arianna" />
  <meta name="application-name" content="Italian with Arianna" />
  <meta name="format-detection" content="telephone=no" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" sizes="180x180" href="https://appuccinohub.github.io/arianna-scroll/apple-touch-icon.png" />
  <link rel="icon" type="image/png" sizes="64x64" href="favicon.png" />

  <!-- Link card for iMessage, WhatsApp, Android (Open Graph / Twitter) -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Arianna Scroll" />
  <meta property="og:title" content="Italian with Arianna 🇮🇹" />
  <meta property="og:description" content="Scroll, tap, and learn Italian one card at a time. Ciao, bella!" />
  <meta property="og:url" content="https://appuccinohub.github.io/arianna-scroll/" />
  <meta property="og:locale" content="en_US" />
  <meta property="og:image" content="https://appuccinohub.github.io/arianna-scroll/og-card.jpg" />
  <meta property="og:image:secure_url" content="https://appuccinohub.github.io/arianna-scroll/og-card.jpg" />
  <meta property="og:image:type" content="image/jpeg" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="1200" />
  <meta property="og:image:alt" content="Cute pastel card: a phone with a gelato, lemons, pizza, hearts and an Italian flag, with the title Italian with Arianna" />
  <meta name="twitter:card" content="summary" />
  <meta name="twitter:title" content="Italian with Arianna 🇮🇹" />
  <meta name="twitter:description" content="Scroll, tap, and learn Italian one card at a time. Ciao, bella!" />
  <meta name="twitter:image" content="https://appuccinohub.github.io/arianna-scroll/og-card.jpg" />
  <meta name="twitter:image:alt" content="Cute pastel card: a phone with a gelato, lemons, pizza, hearts and an Italian flag, with the title Italian with Arianna" />
  <link rel="canonical" href="https://appuccinohub.github.io/arianna-scroll/" />

  <link rel="stylesheet" href="styles.css?v=3" />
</head>
<body>
  <div class="app" id="app">
    <header class="topbar" id="topbar">
      <button type="button" class="icon-btn" id="btnHome" aria-label="Home" title="Home" hidden>
        <span aria-hidden="true">🏠</span>
      </button>
      <div class="top-mid">
        <p class="top-title" id="topTitle">Italian with Arianna</p>
        <div class="dots" id="dots" role="progressbar" aria-label="Progress" aria-valuemin="0" aria-valuemax="10" aria-valuenow="0" hidden></div>
      </div>
      <button type="button" class="icon-btn" id="btnMute" aria-label="Mute sound" aria-pressed="false" title="Sound">
        <span aria-hidden="true" id="muteIcon">🔊</span>
      </button>
    </header>

    <main class="screens">
      <!-- START -->
      <section class="screen active" id="screenHome" aria-labelledby="homeHello">
        <div class="home">
          <div class="home-top">
            <div class="hero-art" aria-hidden="true">
              <span class="orb pink"></span><span class="orb sky"></span><span class="orb lemon"></span>
              <span class="hero-emoji">🍦</span>
              <span class="float f1">💖</span><span class="float f2">🇮🇹</span><span class="float f3">✨</span>
            </div>
            <h1 class="home-hello" id="homeHello">Ciao, Arianna!</h1>
            <p class="home-blurb">Read the English. Tap the Italian that says it. 💬</p>
          </div>

          <div class="home-bottom">
            <div class="picker" id="picker" role="group" aria-label="Choose a session"></div>
            <p class="resume-line" id="resumeLine" hidden></p>
            <button type="button" class="primary-btn" id="btnStart">Start ▶</button>
            <button type="button" class="ghost-btn" id="btnStartOver" hidden>↺ Start over</button>
            <p class="home-soft" id="homeSoft">11 quick cards · sound on 🔊</p>
          </div>
        </div>
      </section>

      <!-- FEED -->
      <section class="screen" id="screenPlay" aria-label="Cards" hidden>
        <div class="feed" id="feed" tabindex="-1" aria-label="Card feed. Swipe up for the next card."></div>
        <div class="side-nav">
          <button type="button" class="nav-btn" id="btnPrev" aria-label="Previous card"><span aria-hidden="true">↑</span></button>
          <button type="button" class="nav-btn" id="btnNext" aria-label="Next card"><span aria-hidden="true">↓</span></button>
        </div>
        <p class="swipe-hint" id="swipeHint" aria-hidden="true" hidden>swipe up ↑</p>
      </section>

      <!-- END -->
      <section class="screen" id="screenEnd" aria-labelledby="endTitle" hidden>
        <div class="end">
          <div class="end-top">
            <p class="end-emoji" aria-hidden="true">🎉</p>
            <h2 id="endTitle" tabindex="-1">Brava, Arianna! 🎉</h2>
            <p class="end-score" id="endScore"></p>
            <p class="end-stars" id="endStars" aria-hidden="true"></p>
            <p class="end-blurb" id="endBlurb"></p>
            <div class="unlock" id="unlockBox" hidden>
              <span class="unlock-emoji" aria-hidden="true">🔓</span>
              <div><strong>Session 2 unlocked!</strong><br />10 new cards are waiting 🍋</div>
            </div>
          </div>
          <div class="end-bottom">
            <button type="button" class="primary-btn" id="btnNextSession" hidden>Start Session 2 ▶</button>
            <button type="button" class="primary-btn" id="btnReplay">↺ Replay</button>
            <button type="button" class="soft-btn" id="btnShare">📤 Share</button>
            <button type="button" class="ghost-btn" id="btnEndHome">🏠 Home</button>
          </div>
        </div>
      </section>
    </main>

    <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
    <div class="confetti" id="confetti" aria-hidden="true"></div>
    <div class="word-bubble" id="wordBubble" role="status" aria-live="polite" hidden></div>
    <audio id="songPlayer" preload="none" playsinline webkit-playsinline></audio>
  </div>
  <noscript><p style="padding:24px;text-align:center">Please turn on JavaScript to play. 💛</p></noscript>
  <script src="data.js?v=3"></script>
  <script src="app.js?v=3"></script>
</body>
</html>
