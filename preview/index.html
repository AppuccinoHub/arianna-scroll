<body>
  <div class="stage">
    <div class="phone" id="phone" role="application" aria-label="Arianna Scroll">
      <header class="app-header">
        <button type="button" class="icon-btn" id="btnHome" aria-label="Home" title="Home" hidden>⌂</button>
        <div class="brand">
          <span class="logo" aria-hidden="true">✨</span>
          <div>
            <h1>Arianna Scroll</h1>
            <p class="subtitle" id="headerSubtitle">For You</p>
          </div>
        </div>
        <div class="header-actions">
          <button type="button" class="icon-btn" id="btnMute" aria-label="Mute sound" title="Sound">🔊</button>
        </div>
      </header>

      <section class="screen active" id="screenHome" aria-label="Home">
        <div class="hero">
          <div class="hero-art" aria-hidden="true">
            <div class="hero-orb lemon"></div>
            <div class="hero-orb sky"></div>
            <div class="hero-sparkle">💃</div>
          </div>
          <p class="home-hello">Ciao, Arianna 💛</p>
          <h2 class="home-title">Dance · karaoke · vlog</h2>
          <p class="home-blurb">Read the English line.<br/>Tap the Italian that says it.</p>
          <button type="button" class="primary-btn" id="btnStart">Start →</button>
          <p class="home-soft">7 quick cards · sound on 🔊</p>
        </div>
      </section>

      <section class="screen" id="screenPlay" aria-label="Feed" hidden>
        <div class="feed" id="feed" tabindex="0" aria-label="Vertical card feed"></div>
        <div class="feed-nav">
          <button type="button" class="nav-btn" id="btnPrev" aria-label="Previous">↑</button>
          <span class="feed-pos" id="feedPos">1</span>
          <button type="button" class="nav-btn" id="btnNext" aria-label="Next">↓</button>
        </div>
      </section>

      <section class="screen" id="screenEnd" aria-label="Done" hidden>
        <div class="end-card">
          <p class="end-emoji" aria-hidden="true">🌟</p>
          <h2 id="endTitle">Brava, Arianna!</h2>
          <p class="end-blurb" id="endBlurb">You did all 7.</p>
          <button type="button" class="primary-btn" id="btnAgain">Play again</button>
          <button type="button" class="ghost-btn" id="btnEndHome">Home</button>
        </div>
      </section>

      <div class="tip-toast" id="tipToast" hidden role="status"></div>
    </div>
  </div>
  <script src="data.js?v=p1"></script>
  <script src="app.js?v=p1"></script>
</body>
</html>
